<!DOCTYPE html>
<html lang="en" style="height:100%">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beacon</title>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@ui5/webcomponents@2/dist/bundle.esm.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ui5/webcomponents-fiori@2/dist/bundle.esm.js"></script>

  <link rel="stylesheet" href="../colors_and_type.css"/>
  <link rel="stylesheet" href="shell.css"/>
</head>
<body>
  <div id="shell">

    <!-- ── Header ──────────────────────────────────────────── -->
    <div id="header">
      <div class="agent-header-inline">
        <div id="nav-toggle" class="agent-icon-sm" role="button" tabindex="0" aria-label="Toggle navigation" aria-expanded="false">✦</div>
        <span id="agent-name-display" class="agent-name-inline">Beacon</span>
      </div>
      <div id="mode-toggle" role="group" aria-label="View mode">
        <button class="mode-btn active" id="btn-chat"      aria-pressed="true">Chat</button>
        <button class="mode-btn"        id="btn-inbox"     aria-pressed="false">Inbox</button>
        <button class="mode-btn"        id="btn-dashboard" aria-pressed="false">Dashboard</button>
      </div>
    </div>

    <!-- ── Layout ──────────────────────────────────────────── -->
    <div id="layout">

      <!-- Sidebar nav -->
      <nav id="sidebar" class="sidebar-collapsed" aria-label="Navigation">
        <div id="sidebar-resize-handle" aria-hidden="true"></div>
        <div id="nav-tree"></div>
        <div class="nav-divider"></div>
        <div class="nav-static">
          <a class="nav-link" href="#">Reference data</a>
          <a class="nav-link" href="#">Templates</a>
        </div>
      </nav>

      <!-- ── Main content ─────────────────────────────────── -->
      <div id="body">

        <!-- Chat mode -->
        <div id="chat-pane">
          <div id="chat-thread" role="log" aria-live="polite" aria-label="Conversation"></div>
          <div id="chat-input-area">
            <textarea
              id="chat-input"
              rows="1"
              placeholder="Ask about requests, paste a customer email, or say 'show my open requests'…"
              aria-label="Message input"></textarea>
            <button id="chat-send" aria-label="Send message">Send</button>
          </div>
        </div>

        <!-- Inbox mode -->
        <div id="inbox-pane" class="hidden">
          <div class="pane-header">
            <h2>Inbox</h2>
            <span class="pane-sub">Pending actions from automation agents</span>
          </div>
          <div id="inbox-list"></div>
        </div>

        <!-- Dashboard mode -->
        <div id="dashboard-pane" class="hidden">
          <div id="dashboard-grid"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Shell modules (load order matters) -->
  <script src="AgentClient.js"></script>
  <script src="ODataClient.js"></script>
  <script src="PersonaStore.js"></script>
  <script src="Renderer.js"></script>
  <script src="NavTree.js"></script>
  <script src="InboxView.js"></script>
  <script src="ChatShell.js"></script>
  <script src="PersonaShell.js"></script>

  <script>
    'use strict'

    const chatPane      = document.getElementById('chat-pane')
    const inboxPane     = document.getElementById('inbox-pane')
    const dashboardPane = document.getElementById('dashboard-pane')
    const btnChat       = document.getElementById('btn-chat')
    const btnInbox      = document.getElementById('btn-inbox')
    const btnDashboard  = document.getElementById('btn-dashboard')
    const sidebar       = document.getElementById('sidebar')
    const navToggle     = document.getElementById('nav-toggle')
    const navTreeEl     = document.getElementById('nav-tree')
    const inboxListEl   = document.getElementById('inbox-list')

    let dashboardInited = false
    let inboxInited     = false

    function setMode(mode) {
      chatPane.classList.add('hidden')
      inboxPane.classList.add('hidden')
      dashboardPane.classList.add('hidden')
      ;[btnChat, btnInbox, btnDashboard].forEach(b => {
        b.classList.remove('active')
        b.setAttribute('aria-pressed', 'false')
      })

      if (mode === 'chat') {
        chatPane.classList.remove('hidden')
        btnChat.classList.add('active')
        btnChat.setAttribute('aria-pressed', 'true')
        document.getElementById('chat-input').focus()
      } else if (mode === 'inbox') {
        inboxPane.classList.remove('hidden')
        btnInbox.classList.add('active')
        btnInbox.setAttribute('aria-pressed', 'true')
        if (!inboxInited) { InboxView.init(inboxListEl); inboxInited = true }
        else InboxView.refresh()
      } else {
        dashboardPane.classList.remove('hidden')
        btnDashboard.classList.add('active')
        btnDashboard.setAttribute('aria-pressed', 'true')
        if (!dashboardInited) { PersonaShell.init(dashboardPane); dashboardInited = true }
      }
    }

    btnChat.addEventListener('click',      () => setMode('chat'))
    btnInbox.addEventListener('click',     () => setMode('inbox'))
    btnDashboard.addEventListener('click', () => setMode('dashboard'))

    navToggle.addEventListener('click', () => {
      const expanded = sidebar.classList.toggle('sidebar-open')
      sidebar.classList.toggle('sidebar-collapsed', !expanded)
      navToggle.setAttribute('aria-expanded', String(expanded))
      if (expanded) {
        const saved = localStorage.getItem('sidebar-width')
        if (saved) sidebar.style.width = saved + 'px'
      } else {
        sidebar.style.width = ''
      }
    })
    navToggle.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navToggle.click() }
    })

    // ── Sidebar drag-to-resize ────────────────────────────────
    const resizeHandle = document.getElementById('sidebar-resize-handle')
    const SIDEBAR_MIN  = 120
    const SIDEBAR_MAX  = 480
    const SIDEBAR_KEY  = 'sidebar-width'

    resizeHandle.addEventListener('mousedown', e => {
      if (!sidebar.classList.contains('sidebar-open')) return
      e.preventDefault()
      resizeHandle.classList.add('dragging')
      sidebar.classList.add('sidebar-resizing')
      document.body.style.cursor = 'col-resize'

      const onMove = ev => {
        const rect  = sidebar.getBoundingClientRect()
        const w     = Math.min(SIDEBAR_MAX, Math.max(SIDEBAR_MIN, ev.clientX - rect.left))
        sidebar.style.width = w + 'px'
      }

      const onUp = () => {
        resizeHandle.classList.remove('dragging')
        sidebar.classList.remove('sidebar-resizing')
        document.body.style.cursor = ''
        const w = parseInt(sidebar.style.width, 10)
        if (!isNaN(w)) localStorage.setItem(SIDEBAR_KEY, w)
        document.removeEventListener('mousemove', onMove)
        document.removeEventListener('mouseup',   onUp)
      }

      document.addEventListener('mousemove', onMove)
      document.addEventListener('mouseup',   onUp)
    })

    NavTree.init(navTreeEl)

    // Resolve identity first, then boot the shell
    ODataClient.post('/whoami', {}).then(identity => {
      const userId = identity?.value?.id || identity?.id || 'anonymous'
      AgentClient.setUser(userId)
      PersonaStore.setUserId(userId)
      ChatShell.init(document.getElementById('chat-pane'))
      PersonaStore.load().then(() => {
        const el = document.getElementById('agent-name-display')
        if (el) el.textContent = PersonaStore.getAssistantName()
      })
    }).catch(() => {
      // whoami failed (e.g. no auth) — boot anyway with anonymous
      ChatShell.init(document.getElementById('chat-pane'))
      PersonaStore.load().then(() => {
        const el = document.getElementById('agent-name-display')
        if (el) el.textContent = PersonaStore.getAssistantName()
      })
    })
  </script>
</body>
</html>
