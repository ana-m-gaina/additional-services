apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: cdm-as-tracker-agent
  version: 2.0.0
  description: >
    Python multi-agent AI service for CDM AS Tracker v2. Implements a Main
    Orchestrator with 11 tools (render_panel, fetch_records, invoke_subagent,
    update_record, propose_layout_change, route_to_agent, surface_pending_action,
    resolve_pending_action, get_reminder_status, register_client,
    register_contract), conversation memory persisted via CAP OData, and a
    Client→Contract agent hierarchy. All Claude calls use Anthropic SDK
    (claude-opus-4-7) with adaptive thinking and a 10-iteration tool-use loop.

type: agent

container:
  buildPath: .
  port: 8000

provides:
  protocols:
    - http
    - rest

agentCard:
  name: CDM AS Tracker Agent v2
  version: 2.0.0
  description: >
    Agent-native AI orchestrator for CDM Additional Services. Claude drives the
    UI by returning panel specs (render_panel tool). Routes to R&R, Pricing,
    Request Management, and O2I specialist subagents. Maintains per-session
    conversation memory. Supports Client→Contract agent delegation and
    Inbox/PendingActions automation.
  capabilities:
    skills:
      - name: rr-lookup
        description: Look up R&R service code chargeability and category
      - name: pricing-lookup
        description: Look up current prices for AS service codes
      - name: request-management
        description: Create and manage AS request lifecycle
      - name: jira-o2i
        description: Generate and submit JIRA Order-to-Invoice tickets
      - name: panel-rendering
        description: Render UI panels (record-card, table, email-draft, kpi-strip, etc.)
      - name: client-routing
        description: Route to Client Orchestrator or Contract Subagent
      - name: inbox-management
        description: Surface and resolve PendingAction items in CDM Inbox
  authentication:
    type: bearer
  streaming:
    enabled: false
  model: claude-opus-4-7

models:
  - executableId: anthropic
    name: claude-opus-4-7
    version: "latest"

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
