apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: cdm-as-tracker-agent
  version: 2.0.0

type: agent

container:
  buildPath: .
  port: 8000

provides:
  protocols:
    - http
    - rest

agentCard:
  name: CDM AS Tracker Agent
  version: 2.0.0
  description: >
    Agent-native AI orchestrator for CDM Additional Services. Drives R&R
    chargeability lookups, pricing confirmations, AS request lifecycle
    management, O2I JIRA ticket generation, meeting notes processing,
    and CDM Inbox automation. Claude claude-opus-4-7 via Anthropic SDK;
    all factual answers come from tool calls only.
  capabilities:
    skills:
      - name: rr-lookup
        description: Look up R&R service code chargeability and category from ingested R&R PDFs
      - name: pricing-lookup
        description: Look up current EUR prices for AS service codes from the pricing list
      - name: request-management
        description: Create and manage the full AS request lifecycle in CAP OData
      - name: jira-o2i
        description: Generate and confirm JIRA Order-to-Invoice tickets for chargeable AS work
      - name: panel-rendering
        description: Render UI panels (record-card, table, email-draft, kpi-strip, confirm-dialog, etc.)
      - name: inbox-management
        description: Surface and resolve PendingAction items in the CDM Inbox
      - name: meeting-notes
        description: Process raw OPS meeting notes into structured JSON with 10 analysis sections
  authentication:
    type: bearer
  streaming:
    enabled: false

models:
  - executableId: anthropic
    name: claude-opus-4-7
    version: "latest"

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
